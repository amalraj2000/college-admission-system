{% extends 'base.html' %}

{% block title %}Pay Admission Fees{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0">Fee Payment</h4>
            </div>
            <div class="card-body text-center p-5">
                <h5>Course: {{ application.course.name }}</h5>
                <h2 class="my-4">Amount: ${{ application.course.fees }}</h2>
                <p class="text-muted">Click the button below to confirm your admission and pay the fees securely.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success btn-lg w-100">Pay Now</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
